# Range accrual callable : coupon proportionnel au temps passé dans le corridor,
# l'émetteur peut rembourser par anticipation à chaque date à partir de 1 an.
notional: 1000
maturity: 3
frequency: quarterly
underlyings:
  - {name: Euro Stoxx 50, vol: 18%, div: 3.2%}
market: {rate: 2.5%, issuer_spread: 1.2%}
coupon:
  type: range_accrual
  rate: 6.5%
  lower: 85%
  upper: 115%
redemption:
  type: full            # capital garanti à 100 %
callable:
  start: 4
  price: 100%
# pas de prix cible : l'outil calcule la valeur et la marge implicite
